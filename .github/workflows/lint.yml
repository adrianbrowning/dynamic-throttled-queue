name: ESLint Check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run ESLint (style)
        id: lint-style
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          pnpm run lint:s 2>&1 | tee lint-output.txt
          LINT_EXIT_CODE=$?
          echo "exit_code=$LINT_EXIT_CODE" >> $GITHUB_OUTPUT
          if [ ! -s lint-output.txt ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "has_errors=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if grep -qiE "(warning|error)" lint-output.txt; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi
          if grep -E "^\s+[0-9]+:[0-9]+\s+error\s" lint-output.txt; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ESLint (correctness)
        id: lint-correctness
        run: pnpm run lint:esl

      - name: Fail on ESLint errors
        if: steps.lint-style.outputs.has_errors == 'true'
        run: exit 1

      - name: Comment lint results on PR
        if: always() && github.event_name == 'pull_request' && steps.lint-style.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        env:
          LINT_OUTPUT_FILE: lint-output.txt
          HAS_ERRORS: ${{ steps.lint-style.outputs.has_errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.LINT_OUTPUT_FILE, 'utf8');
            const output = raw.replace(/[`<>&]/g, c => ({'`':"'", '<':'&lt;', '>':'&gt;', '&':'&amp;'}[c])).slice(0, 60000);
            const hasErrors = process.env.HAS_ERRORS === 'true';
            const icon = hasErrors ? '❌' : '⚠️';
            const status = hasErrors ? 'Failed' : 'Warnings';
            const summary = hasErrors ? 'linting errors' : 'linting warnings';
            const comment = `## ${icon} ESLint Check ${status}\n\n<details>\n<summary>Click to see ${summary}</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>\n\n[View workflow run](${process.env.RUN_URL})`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
