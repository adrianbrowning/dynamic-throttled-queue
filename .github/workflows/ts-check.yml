name: TS Check

on:
  pull_request:
    branches:
      - master
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          checkout-ref: ${{ github.head_ref || github.ref_name }}

      - name: Run TypeScript Check
        id: ts-check
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          pnpm run lint:ts 2>&1 | tee ts-check-output.txt
          TS_EXIT_CODE=$?
          echo "exit_code=$TS_EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $TS_EXIT_CODE -ne 0 ]; then
            echo "TypeScript checks failed. TS_EXIT_CODE=$TS_EXIT_CODE"
            exit 1
          fi

      - name: Comment TS check results on PR
        if: github.event_name == 'pull_request' && steps.ts-check.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('ts-check-output.txt', 'utf8');
            const output = raw.replace(/[`<>&]/g, c => ({'`':"'", '<':'&lt;', '>':'&gt;', '&':'&amp;'}[c])).slice(0, 60000);
            const comment = `## ❌ TypeScript Check Failed\n\n<details>\n<summary>Click to see type errors</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>\n\n[View workflow run](${process.env.RUN_URL})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Fail if TS check failed
        if: steps.ts-check.outputs.exit_code != '0'
        # Repeat the errors here: this is the step `gh run view --log-failed` shows
        run: |
          cat ts-check-output.txt
          exit 1
