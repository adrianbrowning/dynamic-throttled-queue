name: ESLint Check

on:
  pull_request:
    branches:
      - master
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          checkout-ref: ${{ github.head_ref || github.ref_name }}

      - name: Run ESLint Check
        id: lint-check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm run lint:s 2>&1 | tee lint-output.txt
          LINT_EXIT_CODE=$?
          echo "exit_code=$LINT_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ ! -s lint-output.txt ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "has_errors=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -qE "^\s+[0-9]+:[0-9]+\s+(warning|error)\s" lint-output.txt; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

          if grep -E "^\s+[0-9]+:[0-9]+\s+error\s" lint-output.txt; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail on ESLint errors
        if: steps.lint-check.outputs.has_errors == 'true'
        # Repeat the errors here: this is the step `gh run view --log-failed` shows
        run: |
          cat lint-output.txt
          echo "ESLint found errors. Failing workflow."
          exit 1

      - name: Comment lint results on PR
        if: always() && github.event_name == 'pull_request' && steps.lint-check.outputs.has_issues == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_ERRORS: ${{ steps.lint-check.outputs.has_errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('lint-output.txt', 'utf8');
            const output = raw.replace(/[`<>&]/g, c => ({'`':"'", '<':'&lt;', '>':'&gt;', '&':'&amp;'}[c])).slice(0, 60000);
            const hasErrors = process.env.HAS_ERRORS === 'true';
            const icon = hasErrors ? '❌' : '⚠️';
            const status = hasErrors ? 'Failed' : 'Warnings';
            const summary = hasErrors ? 'linting errors' : 'linting warnings';
            const comment = `## ${icon} ESLint Check ${status}\n\n<details>\n<summary>Click to see ${summary}</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>\n\n[View workflow run](${process.env.RUN_URL})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
