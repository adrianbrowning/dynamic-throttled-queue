name: Bumpy Release

on:
  push:
    branches: [master, bumpy/version-packages]

concurrency:
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bumpy_version: ${{ steps.bumpy-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base
        with:
          checkout-fetch-depth: '0'

      - id: bumpy-version
        run: |
          VERSION=$(node -e "const p=require('./package.json'); console.log((p.dependencies?.['@varlock/bumpy'] || p.devDependencies?.['@varlock/bumpy']).replace(/[\^~]/,''))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - id: plan
        run: pnpm exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  version-pr:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base
        with:
          checkout-fetch-depth: '0'
          checkout-token: ${{ secrets.BUMPY_GH_TOKEN || github.token }}

      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  publish-next:
    if: github.ref == 'refs/heads/bumpy/version-packages'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base
        with:
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm build

      - name: Set rc version
        run: |
          SHA=$(git rev-parse --short HEAD)
          node --input-type=module <<EOF
          import { readFileSync, writeFileSync } from 'fs';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          p.version = p.version.replace(/-.*/, '') + '-rc.' + '$SHA';
          writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          EOF

      - run: pnpm publish --tag next --access public --no-git-checks --provenance

  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base
        with:
          checkout-fetch-depth: '0'
          checkout-token: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm build

      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
