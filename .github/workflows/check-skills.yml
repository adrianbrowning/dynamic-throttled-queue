# check-skills.yml — copied by `intent maintainer setup` into .github/workflows/
#
# Validates intent skills and recorded source reviews on pull requests. After a
# release or manual run, writes a read-only report when guidance needs review.
# To enable the isolated PR publisher, set the repository Actions variable
# INTENT_REVIEW_PULL_REQUESTS to true. No write job runs by default.
#
# The steps live in TanStack/intent's reusable workflows, pinned below to the
# commit of the Intent release that copied this file. Dependabot and Renovate
# bump the pin like any other action reference; a `github-actions` entry in
# .github/dependabot.yml is enough. Each job grants only the permissions its
# workflow needs, and Intent runs from this repository's own lockfile-pinned
# copy of @tanstack/intent.
#
# intent-workflow-version: 6
#
# Template variables (replaced by `intent setup`):
#   dynamic-throttled-queue — e.g. @tanstack/query or my-workspace workspace
#   3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0 — the immutable commit packaged with this Intent release

name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/check-skills.yml@3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0
    with:
      artifacts: 'skills/_artifacts'
      repair: true
      # Match engines.node (>=24) and setup-base; the reusable workflow defaults to 22.
      node-version: '26'

  # TEMPORARY: diagnose pending fixture reviews in validate. Remove before merge.
  debug-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm
      - env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          git --version; node --version
          git rev-parse HEAD; git config --get remote.origin.url
          git status --porcelain --untracked-files=all
          sha256sum .intent/review-state.json tests/skills/configure-throttled-queue/*
          git ls-files -s -- tests/skills
          env | grep -E '^GIT' || true
          git config --list --show-origin | grep -vE 'extraheader|includeif' || true
          for spec in "tests/skills/configure-throttled-queue/*" ":(glob)tests/skills/configure-throttled-queue/*" ":(top,glob)tests/skills/configure-throttled-queue/*" ":(top,glob)src/*"; do
            echo "== cached $spec: $(git ls-files --cached -- "$spec" | wc -l)"
            echo "== cached+others $spec: $(git ls-files --cached --others --exclude-standard -- "$spec" | wc -l)"
            echo "== +exclude $spec: $(git ls-files --cached --others --exclude-standard -- "$spec" ':(top,exclude,glob)**/node_modules/**' | wc -l)"
          done
          git ls-files --cached --others --exclude-standard -z -- ':(top,glob)tests/skills/configure-throttled-queue/*' ':(top,exclude,glob)**/node_modules/**'; echo "exit $?"
          git check-ignore -v --no-index tests/skills/configure-throttled-queue/check.test.ts || echo "not ignored"
          ./node_modules/.bin/intent maintainer review --base "$BASE" --json > "$RUNNER_TEMP/review.json" || true
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const s = JSON.parse(fs.readFileSync(".intent/review-state.json", "utf8"));
            console.log("base", r.base, "head", r.head);
            for (const i of r.items) {
              const rec = s.items[i.id];
              console.log(i.id, "problems", JSON.stringify(i.problems));
              for (const f of i.changedFiles) console.log("  ", f, "now", i.snapshot[f], "recorded", rec && rec.snapshot[f]);
            }
          ' "$RUNNER_TEMP/review.json"
          ./node_modules/.bin/intent maintainer check --base "$BASE" --artifacts skills/_artifacts || true

  review:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/review-skills.yml@3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0
    with:
      package-label: 'dynamic-throttled-queue'
      node-version: '26'

  publish-review:
    needs: review
    if: vars.INTENT_REVIEW_PULL_REQUESTS == 'true' && needs.review.outputs.has-review == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: TanStack/intent/.github/workflows/publish-skill-review.yml@3cf6c146aa36288fba6bc5b7190413d878706756 # v0.5.0
