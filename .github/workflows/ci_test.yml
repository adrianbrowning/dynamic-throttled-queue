name: CI Tests

on:
  pull_request:
    branches:
      - master
    types: [ opened, synchronize, reopened ]

jobs:
  test-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm run test
